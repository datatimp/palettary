<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palettary - Color Primitives for Figma</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon-palette.png">
</head>
<body>
    <header>
        <div class="container">
            <img src="assets/images/palettary-logo-color-reversed.svg">
            <p class="tagline">Curated Color Primitives for Figma</p>
        </div>
    </header>

    <main class="container">
        <!-- Palette Selector -->
        <section class="selector-section">
            <div class="selector-wrapper">
                <label for="palette-select">Choose a collection:</label>
                <select id="palette-select" class="palette-dropdown">
                    <option value="">Select a palette...</option>
                </select>
            </div>
        </section>

        <!-- Selected Palette Display -->
        <section id="palette-display" class="palette-display" style="display: none;">
            <div class="palette-header">
                <div class="palette-info">
                    <h2 id="palette-name"></h2>
                    <p id="palette-description"></p>
                </div>
                <div class="export-buttons">
                    <button class="export-btn" data-format="json">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 11L4 7H6V3H10V7H12L8 11Z" fill="currentColor"/>
                            <path d="M3 13H13V14H3V13Z" fill="currentColor"/>
                        </svg>
                        Figma JSON
                    </button>
                    <button class="export-btn" data-format="css">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 11L4 7H6V3H10V7H12L8 11Z" fill="currentColor"/>
                            <path d="M3 13H13V14H3V13Z" fill="currentColor"/>
                        </svg>
                        CSS
                    </button>
                    <button class="export-btn" data-format="txt">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 11L4 7H6V3H10V7H12L8 11Z" fill="currentColor"/>
                            <path d="M3 13H13V14H3V13Z" fill="currentColor"/>
                        </svg>
                        TXT
                    </button>
                </div>
            </div>

            <div id="color-swatches" class="color-swatches">
                <!-- Color swatches will be dynamically inserted here -->
            </div>
        </section>

        <!-- Palette Gallery -->
        <section class="palette-gallery">
            <h2 class="gallery-title">Newest Palettes</h2>
            <div id="palette-cards" class="palette-cards">
                <!-- Palette cards will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Made with ❤️ for designers by <a href="https://github.com/datatimp">datatimp</a></p> © 2026
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
